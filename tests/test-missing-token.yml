name: Test missing GITHUB_TOKEN fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
        with:
          NO_CREATE_RELEASE: 'true'
      - name: Assert action failed without a token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NOTES: ${{ steps.action.outputs.notes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "notes: $NOTES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when GITHUB_TOKEN is empty"
            exit 1
          fi
          if [ -n "$NOTES" ]; then
            echo "FAIL: notes should not be set when token is missing"
            exit 1
          fi
          echo "PASS"
