name: Test auto-tagging (no TAG_NAME)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action ran (auto-tag mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without TAG_NAME the action uses auto-tagging logic.
          # It may fail if there are no closed issues or no prior tags,
          # but it must not be 'skipped' — it must have actually executed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action executed in auto-tag mode (outcome=$OUTCOME)"
